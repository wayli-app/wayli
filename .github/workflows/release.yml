name: Release

# This workflow handles all release types: stable releases and release candidates (RC)
#
# Trigger: Manual workflow_dispatch only.
#
# How to create a release:
#   1. Go to Actions → Release → Run workflow
#   2. Select branch (usually 'main')
#   3. Choose release_type: rc or stable
#   4. Click "Run workflow"
#
# You only ever pick ONE thing: release_type. The next version number is
# auto-deduced from the latest git tag, so there is no need to reason about
# bump types or "continue" vs "auto". The state machine below covers every case:
#
#   | Current tag      | release_type | Result          | What happens              |
#   | ---------------- | ------------ | --------------- | ------------------------- |
#   | 2.2.0-rc.36 (RC) | rc           | 2.2.0-rc.37     | Continue the RC series    |
#   | 2.2.0-rc.36 (RC) | stable       | 2.2.0           | Promote RC to stable      |
#   | 2.2.1 (stable)   | rc           | 2.2.2-rc.1      | New line, append -rc.1    |
#   | 2.2.1 (stable)   | stable       | 2.2.2           | New line, no suffix       |
#
# When starting a new version line (stable → release), the bump level is
# auto-detected from conventional commits since the last tag:
#   - BREAKING CHANGE: or feat!  → major
#   - feat:                        → minor
#   - anything else                → patch
# Use the optional `bump` input to override auto-detection (rarely needed).
#
# Component Toggles:
#   - Publish Docker image: Build and push the Wayli Docker image to GHCR
#   - Publish Helm chart: Package and publish Helm chart to GHCR and GitHub Pages
#   - Generate AI notes: Use AI to summarize changes for release notes
#
# RC Release behavior:
#   - Version format: vMAJOR.MINOR.PATCH-rc.N (e.g., v2.2.0-rc.1)
#   - Marked as GitHub pre-release
#   - Docker images tagged with version and 'rc' (NOT 'latest')
#   - Helm charts published with prerelease annotation
#
# Stable Release behavior:
#   - Version format: vMAJOR.MINOR.PATCH (e.g., v2.2.1)
#   - Marked as GitHub release (not pre-release)
#   - Docker images tagged with version and 'latest'
#   - Helm charts published normally

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (the only choice you normally need to make)'
        required: true
        type: choice
        options:
          - stable
          - rc
        default: rc
      bump:
        description: 'Bump level for a NEW version line (stable → release). Ignored when continuing or promoting an RC. "auto" detects from conventional commits.'
        required: false
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: auto
      dry_run:
        description: 'Dry run (no actual release)'
        required: false
        default: false
        type: boolean
      publish_docker:
        description: 'Publish Docker image'
        required: false
        type: boolean
        default: true
      publish_helm:
        description: 'Publish Helm chart'
        required: false
        type: boolean
        default: true
      publish_android:
        description: 'Build and publish Android APKs (gplay + foss) to the release'
        required: false
        type: boolean
        default: true
      generate_ai_notes:
        description: 'Generate AI-assisted release notes'
        required: false
        type: boolean
        default: true

permissions:
  packages: write
  contents: write
  pages: write
  id-token: write

# Serialize manual releases on the same ref so concurrent dispatches don't
# race on git tags, container pushes, or the gh-pages index update.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc_version.outputs.version }}
      is_rc: ${{ steps.calc_version.outputs.is_rc }}
      prev_tag: ${{ steps.calc_version.outputs.prev_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate version
        id: calc_version
        run: |
          # The latest git tag is the single source of truth for the current version.
          # (Mirrors Fluxbase's approach; the release job keeps package.json in sync.)
          git fetch --tags --force

          # Determine the latest tag with correct semver precedence: a stable
          # release (vX.Y.Z) always outranks any pre-release of the same base
          # (vX.Y.Z-rc.N). `sort -V` and `git --sort=v:refname` both order some
          # pre-releases AFTER their stable (e.g. v2.2.0-rc.39 after v2.2.0),
          # which is wrong per semver and caused release version collisions.
          # Prefer the highest stable tag; fall back to the highest RC only when
          # no stable tag exists.
          LATEST_STABLE=$(git tag -l 'v*[0-9].[0-9].[0-9]' | grep -v -e '-' | sort -V | tail -n1)
          if [ -n "$LATEST_STABLE" ]; then
            LATEST_TAG="$LATEST_STABLE"
          else
            LATEST_TAG=$(git tag -l 'v*' | sort -V | tail -n1)
          fi
          if [ -z "$LATEST_TAG" ]; then
            echo "Error: No 'v*' tags found. Cannot determine current version."
            exit 1
          fi
          echo "Latest tag: $LATEST_TAG"

          CURRENT_VERSION="${LATEST_TAG#v}"
          PREV_TAG="$LATEST_TAG"

          RELEASE_TYPE="${{ inputs.release_type }}"

          # Parse current version (handles both stable and RC versions)
          if [[ "$CURRENT_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-rc\.([0-9]+))?$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            RC_SUFFIX="${BASH_REMATCH[4]}"
            RC_NUM="${BASH_REMATCH[5]:-0}"
            if [ -n "$RC_SUFFIX" ]; then
              LAST_IS_RC="true"
            else
              LAST_IS_RC="false"
            fi
          else
            echo "Error: Cannot parse version '$CURRENT_VERSION' (from tag $LATEST_TAG)"
            exit 1
          fi

          echo "Parsed: MAJOR=$MAJOR, MINOR=$MINOR, PATCH=$PATCH, RC_NUM=$RC_NUM, LAST_IS_RC=$LAST_IS_RC"

          IS_RC="false"
          if [ "$RELEASE_TYPE" = "rc" ]; then
            IS_RC="true"
          fi

          echo "prev_tag=${PREV_TAG}" >> $GITHUB_OUTPUT

          # ----------------------------------------------------------------------
          # Version state machine. One input (release_type) drives everything.
          #   last is RC  + rc      → continue the RC series (increment rc.N)
          #   last is RC  + stable  → promote RC to stable (strip -rc.N)
          #   last is stable + rc   → new version line, auto-detect bump, + -rc.1
          #   last is stable + stable → new version line, auto-detect bump
          # ----------------------------------------------------------------------
          if [ "$LAST_IS_RC" = "true" ]; then
            BASE_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            if [ "$IS_RC" = "true" ]; then
              # RC → RC: continue the series
              NEW_VERSION="${BASE_VERSION}-rc.$((RC_NUM + 1))"
              echo "Continuing RC series: $CURRENT_VERSION → $NEW_VERSION"
            else
              # RC → stable: promote. If the stable tag already exists, the RC
              # series belongs to a version that already shipped -- fail loudly so
              # the operator picks the right release (e.g. a new patch line)
              # instead of recomputing an already-released version.
              if git tag -l "v${BASE_VERSION}" | grep -q .; then
                echo "::error::Stable v${BASE_VERSION} already exists (this RC series is for an already-released version). Re-run with the appropriate release for a new version line."
                exit 1
              fi
              NEW_VERSION="${BASE_VERSION}"
              echo "Promoting RC to stable: $CURRENT_VERSION → $NEW_VERSION"
            fi
          else
            # Stable → release: compute a new version line.
            # Bump level comes from the `bump` input (auto-detect by default).
            INPUT_BUMP="${{ inputs.bump }}"
            BUMP="$INPUT_BUMP"

            if [ "$BUMP" = "auto" ]; then
              BUMP="patch"  # default fallback
              # Conventional-commit auto-detection. git log --grep uses basic
              # regex by default, so pipe through `grep -E` for scoped commits
              # (e.g. "feat(ai):", "fix(auth):"), which the old "^feat:" pattern
              # missed entirely.
              # BREAKING CHANGE: footer -> major; feat!/fix! -> major; feat -> minor.
              if git log "$PREV_TAG"..HEAD --oneline | grep -qE "BREAKING CHANGE:"; then
                BUMP="major"
              elif git log "$PREV_TAG"..HEAD --oneline | grep -qE "^[0-9a-f]+ (feat|fix|chore|refactor|perf|build)(\(.+\))?!:"; then
                BUMP="major"
              elif git log "$PREV_TAG"..HEAD --oneline | grep -qE "^[0-9a-f]+ feat(\(.+\))?:"; then
                BUMP="minor"
              fi
              echo "Auto-detected bump: $BUMP"
            else
              echo "Using manual bump: $BUMP"
            fi

            case "$BUMP" in
              major)
                BASE_VERSION="$((MAJOR + 1)).0.0"
                ;;
              minor)
                BASE_VERSION="${MAJOR}.$((MINOR + 1)).0"
                ;;
              patch)
                BASE_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
                ;;
              *)
                echo "Error: Unknown bump '$BUMP'"
                exit 1
                ;;
            esac

            if [ "$IS_RC" = "true" ]; then
              # If this base version already has RC tags (e.g. a previous
              # release run cut v2.3.0-rc.1, then this run re-targeted the same
              # base version), continue the series at max(rc.N)+1 instead of
              # hardcoding rc.1 and colliding with the existing tag/chart version.
              EXISTING_RC=$(git tag -l "v${BASE_VERSION}-rc.*" | sed -E "s/.*-rc\.([0-9]+)$/\1/" | sort -n | tail -n1)
              if [ -n "$EXISTING_RC" ]; then
                NEXT_RC=$((EXISTING_RC + 1))
                echo "Base $BASE_VERSION already has RC tags (latest rc.$EXISTING_RC) — continuing series at rc.$NEXT_RC"
              else
                NEXT_RC=1
              fi
              NEW_VERSION="${BASE_VERSION}-rc.${NEXT_RC}"
            else
              NEW_VERSION="$BASE_VERSION"
            fi
            echo "New $BUMP release: $CURRENT_VERSION → $NEW_VERSION"
          fi

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "is_rc=$IS_RC" >> $GITHUB_OUTPUT

  generate-changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    needs: get-version
    if: inputs.dry_run == false
    env:
      PREV_TAG: ${{ needs.get-version.outputs.prev_tag }}
    outputs:
      body: ${{ steps.build_body.outputs.body }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate AI summary
        id: ai_summary
        if: inputs.generate_ai_notes
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Check if API key is set
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::warning::GROQ_API_KEY secret is not set, skipping AI summary"
            echo "summary=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get commit messages for summary
          COMMITS=$(git log "${{ env.PREV_TAG }}"..HEAD --oneline 2>/dev/null | head -50)

          # Get changed files summary
          CHANGED_FILES=$(git diff --stat "${{ env.PREV_TAG }}"..HEAD 2>/dev/null | tail -1)

          # Create prompt with heredoc (avoids sed escaping issues with special characters)
          cat > /tmp/prompt.txt << PROMPT_EOF
          Summarize these commits for a release changelog.

          Rules:
          - Focus ONLY on user-facing features and bug fixes
          - Ignore: CI changes, dependency updates, test changes, workflow changes
          - Do NOT mention: GitHub Actions, CI/CD, pipelines, internal tooling, Groq, Claude
          - Do NOT use marketing language like "excited to announce" or "we are pleased"
          - Be factual and concise
          - If there are no significant user-facing changes, just say "Bug fixes and maintenance improvements."

          Commits:
          $COMMITS

          Changed files: $CHANGED_FILES

          Write the summary now (1-2 sentences only):
          PROMPT_EOF

          # Call Groq API (OpenAI-compatible)
          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" https://api.groq.com/openai/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -d "{
              \"model\": \"llama-3.3-70b-versatile\",
              \"max_tokens\": 300,
              \"messages\": [{
                \"role\": \"user\",
                \"content\": $(jq -Rs . /tmp/prompt.txt)
              }]
            }")

          # Extract HTTP status code and response body
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::warning::Groq API returned status $HTTP_STATUS"
            echo "summary=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract the summary from the response
          SUMMARY=$(echo "$RESPONSE_BODY" | jq -r '.choices[0].message.content // empty')

          if [ -z "$SUMMARY" ]; then
            echo "::warning::Could not extract summary from API response"
            echo "summary=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "AI Summary: $SUMMARY"
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

      - name: Build changelog body
        id: build_body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_SUMMARY: ${{ steps.ai_summary.outputs.summary }}
        run: |
          PREV_TAG="${{ env.PREV_TAG }}"

          FEATURES=""
          FIXES=""
          OTHER=""

          # Group commits by conventional-commit type (feat → Features, fix → Bug Fixes, else → Other)
          FEATURES=$(git log "${PREV_TAG}"..HEAD --oneline --no-merges --grep="^feat" 2>/dev/null | sed 's/^/ - /')
          FIXES=$(git log "${PREV_TAG}"..HEAD --oneline --no-merges --grep="^fix" 2>/dev/null | sed 's/^/ - /')
          OTHER=$(git log "${PREV_TAG}"..HEAD --oneline --no-merges \
            --grep="^feat" --grep="^fix" --invert-grep 2>/dev/null | sed 's/^/ - /')

          # Stats: commit count + contributor count since the last tag
          COMMIT_COUNT=$(git rev-list --count --no-merges "${PREV_TAG}"..HEAD 2>/dev/null || echo 0)
          CONTRIBUTOR_COUNT=$(git shortlog -sne --no-merges "${PREV_TAG}"..HEAD 2>/dev/null | wc -l | tr -d ' ')

          # GitHub's `merged:` qualifier needs a date; derive it from the tag's commit
          MERGED_SINCE=$(git log -1 --format=%cI "${PREV_TAG}" 2>/dev/null)

          # Assemble the changelog
          {
            # Optional AI lead paragraph
            if [ -n "$AI_SUMMARY" ]; then
              printf '%s\n\n' "$AI_SUMMARY"
            fi

            # Merged pull requests since the last tag
            PR_LIST=$(gh pr list --state merged --base main \
              --search "merged:>${MERGED_SINCE}" \
              --json number,title,author \
              --template '{{range .}} - {{.title}} (#{{.number}}) @{{.author.login}}{{"\n"}}{{end}}' 2>/dev/null || true)
            if [ -n "$PR_LIST" ]; then
              printf '### Merged Pull Requests\n\n%s\n' "$PR_LIST"
            fi

            if [ -n "$FEATURES" ]; then
              printf '### Features\n\n%s\n' "$FEATURES"
            fi
            if [ -n "$FIXES" ]; then
              printf '### Bug Fixes\n\n%s\n' "$FIXES"
            fi
            if [ -n "$OTHER" ]; then
              printf '### Other Changes\n\n%s\n' "$OTHER"
            fi

            printf '\n**%s commits** by **%s contributors**\n\n' "$COMMIT_COUNT" "$CONTRIBUTOR_COUNT"
            printf '**Full Changelog**: https://github.com/${{ github.repository }}/compare/%s...v%s\n' "$PREV_TAG" "${{ needs.get-version.outputs.version }}"
          } > /tmp/changelog.md

          echo "--- Generated changelog ---"
          cat /tmp/changelog.md
          echo "----------------------------"

          # Use a heredoc delimiter that won't appear in the content, so
          # multi-line markdown is passed cleanly to GITHUB_OUTPUT without
          # jq JSON-escaping (which produces literal \n and surrounding quotes).
          {
            echo "body<<CHANGELOG_EOF"
            cat /tmp/changelog.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  release:
    runs-on: ubuntu-latest
    needs: [get-version, generate-changelog]
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
      IS_RC: ${{ needs.get-version.outputs.is_rc }}
      PREV_TAG: ${{ needs.get-version.outputs.prev_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Install Fluxbase CLI
        run: curl -fsSL https://raw.githubusercontent.com/nimbleflux/fluxbase/main/install-cli.sh | bash

      - name: Prepare SvelteKit
        working-directory: web
        run: bunx svelte-kit sync

      - name: Run unit tests
        working-directory: web
        run: bun run test:unit -- --run --config vitest.ci.config.ts

      - name: Build app
        working-directory: web
        run: bun run build

      - name: Display version info
        run: |
          echo "Version: ${{ env.VERSION }}"
          echo "Is RC: ${{ env.IS_RC }}"
          echo "Previous tag: ${{ env.PREV_TAG }}"
          echo "Dry run: ${{ inputs.dry_run }}"

      - name: Update package.json version
        if: inputs.dry_run == false
        working-directory: web
        run: |
          # Update version in package.json using jq
          jq '.version = "${{ env.VERSION }}"' package.json > package.json.tmp && mv package.json.tmp package.json
          echo "Updated package.json to version ${{ env.VERSION }}"

      - name: Update deployment files with new version
        if: inputs.dry_run == false
        run: |
          # Update Helm Chart.yaml with new appVersion
          sed -i "s/^appVersion: .*/appVersion: \"v${{ env.VERSION }}\"/" charts/wayli/Chart.yaml
          echo "Updated Helm chart appVersion to v${{ env.VERSION }}"

          # Update init container image in values.yaml
          sed -i "s|image: ghcr.io/nimbleflux/wayli:.*|image: ghcr.io/nimbleflux/wayli:v${{ env.VERSION }}|" charts/wayli/values.yaml
          echo "Updated init container image to v${{ env.VERSION }}"

          # Update docker-compose .env.example with new version
          sed -i "s/^WAYLI_VERSION=.*/WAYLI_VERSION=v${{ env.VERSION }}/" deploy/docker-compose/.env.example
          echo "Updated docker-compose to version v${{ env.VERSION }}"

      - name: Commit and tag release
        if: inputs.dry_run == false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add web/package.json web/bun.lock charts/wayli/Chart.yaml charts/wayli/values.yaml deploy/docker-compose/.env.example

          # Only commit when the version bump actually produced a diff. When the
          # target version is already in the files (e.g. a re-run, or the version
          # was already committed), `git commit` fails with "nothing to commit" —
          # guard against that so the release can proceed to tag/publish.
          if git diff --staged --quiet; then
            echo "No version-file changes to commit (version already at v${{ env.VERSION }})"
          else
            git commit -m "chore(release): v${{ env.VERSION }}"
            git push
          fi

          # Tag only if it doesn't already exist, so re-runs don't fail on a
          # duplicate tag. `git tag` errors on an existing tag; `git tag -l`
          # lets us check first.
          if [ -n "$(git tag -l v${{ env.VERSION }})" ]; then
            echo "Tag v${{ env.VERSION }} already exists - skipping tag/push"
          else
            git tag v${{ env.VERSION }}
            git push --tags
          fi

          echo "Release v${{ env.VERSION }} committed and tagged"

      - name: Create GitHub Release
        if: inputs.dry_run == false
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          prerelease: ${{ env.IS_RC == 'true' }}
          body: ${{ needs.generate-changelog.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # Android App Publishing (gplay + foss APKs, attached to the release)
  # ==========================================================================

  publish-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    needs: [get-version, release]
    if: inputs.dry_run == false && inputs.publish_android
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: v${{ env.VERSION }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # fluxbase-kotlin resolves from GitHub Packages with the workflow token
      # (settings.gradle.kts reads GITHUB_ACTOR/GITHUB_TOKEN).
      - name: Resolve version
        id: version
        run: |
          echo "versionCode=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        id: keystore
        env:
          WAYLI_KEYSTORE_BASE64: ${{ secrets.WAYLI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$WAYLI_KEYSTORE_BASE64" ]; then
            echo "$WAYLI_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wayli-release.keystore"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secret found — building UNSIGNED release APKs."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APKs + Play AAB
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAYLI_KEYSTORE_FILE: ${{ steps.keystore.outputs.available == 'true' && format('{0}/wayli-release.keystore', runner.temp) || '' }}
          WAYLI_KEYSTORE_PASSWORD: ${{ secrets.WAYLI_KEYSTORE_PASSWORD }}
          WAYLI_KEY_ALIAS: ${{ secrets.WAYLI_KEY_ALIAS }}
          WAYLI_KEY_PASSWORD: ${{ secrets.WAYLI_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew :app:assembleGplayRelease :app:assembleFossRelease :app:bundleGplayRelease \
            -PversionName=${{ env.VERSION }} \
            -PversionCode=${{ steps.version.outputs.versionCode }}

      - name: Rename artifacts
        run: |
          cd android/app/build/outputs
          mv apk/gplay/release/app-gplay-release.apk "apk/gplay/release/wayli-${{ env.VERSION }}-gplay.apk"
          mv apk/foss/release/app-foss-release.apk "apk/foss/release/wayli-${{ env.VERSION }}-foss.apk"
          mv bundle/gplayRelease/app-gplay-release.aab "bundle/gplayRelease/wayli-${{ env.VERSION }}-gplay.aab"

      - name: Attach APKs + AAB to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            android/app/build/outputs/apk/gplay/release/wayli-${{ env.VERSION }}-gplay.apk
            android/app/build/outputs/apk/foss/release/wayli-${{ env.VERSION }}-foss.apk
            android/app/build/outputs/bundle/gplayRelease/wayli-${{ env.VERSION }}-gplay.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # Docker Image Publishing (Split by Architecture)
  # ==========================================================================

  publish-docker-amd64:
    name: Build Docker Image (AMD64)
    runs-on: ubuntu-latest
    needs: [get-version, release]
    if: inputs.dry_run == false && inputs.publish_docker
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/nimbleflux/wayli:v${{ env.VERSION }}-amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  publish-docker-arm64:
    name: Build Docker Image (ARM64)
    runs-on: ubuntu-24.04-arm
    needs: [get-version, release]
    if: inputs.dry_run == false && inputs.publish_docker
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ghcr.io/nimbleflux/wayli:v${{ env.VERSION }}-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  publish-docker-manifest:
    name: Create Docker Multi-arch Manifest
    runs-on: ubuntu-latest
    needs: [get-version, publish-docker-amd64, publish-docker-arm64]
    if: inputs.dry_run == false && inputs.publish_docker
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
      IS_RC: ${{ needs.get-version.outputs.is_rc }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Create and push multi-arch manifest
        run: |
          # Create manifest for version tag
          docker buildx imagetools create -t ghcr.io/nimbleflux/wayli:v${{ env.VERSION }} \
            ghcr.io/nimbleflux/wayli:v${{ env.VERSION }}-amd64 \
            ghcr.io/nimbleflux/wayli:v${{ env.VERSION }}-arm64

          # Create manifest for latest/rc tag
          if [ "${{ env.IS_RC }}" = "true" ]; then
            docker buildx imagetools create -t ghcr.io/nimbleflux/wayli:rc \
              ghcr.io/nimbleflux/wayli:v${{ env.VERSION }}-amd64 \
              ghcr.io/nimbleflux/wayli:v${{ env.VERSION }}-arm64
          else
            docker buildx imagetools create -t ghcr.io/nimbleflux/wayli:latest \
              ghcr.io/nimbleflux/wayli:v${{ env.VERSION }}-amd64 \
              ghcr.io/nimbleflux/wayli:v${{ env.VERSION }}-arm64
          fi

          # Create manifest for short SHA tag
          docker buildx imagetools create -t ghcr.io/nimbleflux/wayli:${{ env.SHORT_SHA }} \
            ghcr.io/nimbleflux/wayli:v${{ env.VERSION }}-amd64 \
            ghcr.io/nimbleflux/wayli:v${{ env.VERSION }}-arm64

  # ==========================================================================
  # Helm Chart Publishing
  # ==========================================================================

  publish-helm-chart:
    name: Publish Helm Chart
    runs-on: ubuntu-latest
    needs: [get-version, release]
    if: inputs.dry_run == false && inputs.publish_helm
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
      IS_RC: ${{ needs.get-version.outputs.is_rc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.3

      - name: Update chart dependencies
        run: |
          # Clean existing dependencies and lock file
          rm -rf charts/wayli/charts/*
          rm -f charts/wayli/Chart.lock

          # Clear Helm cache
          rm -rf ~/.cache/helm

          # OCI-based dependencies don't need helm repo add
          helm dependency update charts/wayli

      - name: Bump chart version
        run: |
          NEW_VERSION="${{ env.VERSION }}"
          IS_RC="${{ env.IS_RC }}"

          echo "📦 Setting chart version to: $NEW_VERSION"

          # Update Chart.yaml version
          sed -i "s/^version: .*/version: $NEW_VERSION/" charts/wayli/Chart.yaml

          # Add prerelease annotation for RC versions
          if [ "$IS_RC" = "true" ]; then
            if grep -q "^annotations:" charts/wayli/Chart.yaml; then
              if ! grep -q "artifacthub.io/prerelease" charts/wayli/Chart.yaml; then
                sed -i '/^annotations:/a\  artifacthub.io/prerelease: "true"' charts/wayli/Chart.yaml
              fi
            else
              echo -e "\nannotations:\n  artifacthub.io/prerelease: \"true\"" >> charts/wayli/Chart.yaml
            fi
          else
            # Remove prerelease annotation for stable releases
            sed -i '/artifacthub.io\/prerelease/d' charts/wayli/Chart.yaml
            sed -i '/^annotations:$/{ N; /^annotations:\n$/d }' charts/wayli/Chart.yaml
          fi

          git add charts/wayli/Chart.yaml

          # Only commit when the bump actually produced a diff. When the chart
          # is already at the target version (e.g. a re-run of the release on an
          # already-bumped commit), `git commit` fails with "nothing to commit"
          # — guard against that so the publish can proceed. Mirrors the
          # version-commit guard in the "Prepare release" step above.
          if git diff --staged --quiet; then
            echo "No chart changes to commit (already at version $NEW_VERSION)"
          else
            git commit -m "chore(chart): Bump version to $NEW_VERSION [skip ci]"
            git push
          fi

          echo "📦 Chart version set to $NEW_VERSION"

      - name: Package Helm chart
        run: |
          mkdir -p .cr-release-packages
          helm package charts/wayli -d .cr-release-packages

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Helm chart to GHCR (OCI)
        run: |
          helm push .cr-release-packages/wayli-${{ env.VERSION }}.tgz oci://ghcr.io/nimbleflux/charts
          echo "📦 Helm chart pushed to ghcr.io/nimbleflux/charts/wayli:${{ env.VERSION }}"

      - name: Install chart-releaser
        run: |
          curl -sSLo cr.tar.gz "https://github.com/helm/chart-releaser/releases/download/v1.6.1/chart-releaser_1.6.1_linux_amd64.tar.gz"
          tar -xzf cr.tar.gz
          sudo mv cr /usr/local/bin/cr

      - name: Upload chart to GitHub Release
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cr upload \
            --owner nimbleflux \
            --git-repo wayli \
            --package-path .cr-release-packages \
            --release-name-template "chart-{{ .Version }}" \
            --skip-existing

      - name: Update Helm repository index
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .cr-index

          # Fetch existing index from gh-pages if it exists
          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git show gh-pages:index.yaml > .cr-index/index.yaml 2>/dev/null || true
          fi

          cr index \
            --owner nimbleflux \
            --git-repo wayli \
            --package-path .cr-release-packages \
            --index-path .cr-index/index.yaml \
            --release-name-template "chart-{{ .Version }}"

      - name: Deploy index.yaml to gh-pages
        run: |
          cp .cr-index/index.yaml /tmp/index.yaml
          git stash --include-untracked

          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi

          cp /tmp/index.yaml index.yaml
          git add index.yaml
          git commit -m "Update Helm repository index [skip ci]" || echo "No changes to commit"
          git push origin gh-pages
